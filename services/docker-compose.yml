# Local-only stack: Streamlit -> FastAPI -> MongoDB.
# Values come from services/.env (copy .env.example). In AWS these same variable
# names are supplied by SSM Parameter Store instead.

name: ecs-lab

services:
  mongodb:
    build: ./mongodb
    image: ecs-lab/mongodb:dev
    restart: unless-stopped
    environment:
      # Consumed by the official entrypoint on first start.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      # Consumed by init/01-app-user.js.
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      # Loopback only: the shipped .env passwords must not be reachable from the LAN.
      - "127.0.0.1:27017:27017"   # for local Compass / mongosh
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # ping needs no authentication; it just proves the server is accepting ops.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    image: ecs-lab/backend:dev
    restart: unless-stopped
    environment:
      MONGO_HOST: mongodb          # compose DNS name of the service above
      MONGO_PORT: "27017"
      MONGO_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      MONGO_AUTH_SOURCE: ${MONGO_DB}
    ports:
      - "8000:8000"
    volumes:
      # Bind mount + --reload gives edit-and-refresh without rebuilding the image.
      - ./backend/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    image: ecs-lab/frontend:dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      # Whole directory, not app.py alone: a single-file bind pins an inode, and
      # editors that save by rename replace it where the container cannot follow.
      - ./frontend:/app:ro   # Streamlit reloads on save
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:   # named volume; `docker compose down -v` wipes it and re-runs the init script
