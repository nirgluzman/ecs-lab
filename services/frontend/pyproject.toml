# Virtual project (no [build-system]): `uv sync` only builds the .venv.
[project]
name = "frontend"
version = "0.1.0"
description = "Streamlit UI for the Items API"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "requests>=2.32",   # thin HTTP client for the backend REST calls
]
