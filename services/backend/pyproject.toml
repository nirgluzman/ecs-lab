# No [build-system] table on purpose: uv then treats this as a "virtual" project,
# so `uv sync` installs the dependencies into .venv without packaging ./app.
[project]
name = "backend"
version = "0.1.0"
description = "FastAPI CRUD API backed by MongoDB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",   # ASGI server; [standard] pulls in watchfiles for --reload
    "pymongo>=4.10",             # ships AsyncMongoClient (motor is deprecated)
    "pydantic-settings>=2.6",    # env-var driven configuration
]
